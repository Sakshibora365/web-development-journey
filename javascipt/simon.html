<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simon Game</title>
    <link rel="stylesheet" href="simon.css">
</head>
<body>
    <section class="simonbg">    
        <section class="simonhead">
            <h1>Simon Game</h1>
            <p>Press button to start</p>
        </section>

        <section class="simonbody">
            <div class="simonbox">
                <div class="simonbtn btne" id="green">1</div>
                <div class="simonbtn btne" id="red">2</div>
                <div class="simonbtn btne" id="yellow">3</div>
                <div class="simonbtn btn" id="blue">4</div>
            </div>
        </section>

        <div class="button">PRESS HERE</div>
    </section>

    <script src="simon.js"></script>
</body>
</html>
